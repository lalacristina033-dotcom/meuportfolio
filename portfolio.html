    <script>
        const SUPABASE_URL = 'https://ffciozzntkkcedlgjnsv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmY2lvenpudGtrY2VkbGdqbnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTAyNjIsImV4cCI6MjExMDM4NjI2Mn0.gtJn41T6d5xUn-w3JV9FLaKh6UHOh07JyKvqmxr9PAU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarProjetos() {
            const container = document.getElementById('listaProjetos');
            const { data, error } = await supabaseClient.from('projetos').select('*');

            if (error) {
                container.innerHTML = '<p>Erro ao carregar projetos.</p>';
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p>Nenhum projeto cadastrado ainda.</p>';
                return;
            }

            container.innerHTML = data.map(proj => `
                <article class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <h2 style="font-size: 1.35rem; margin-bottom: 0.75rem;">${proj.titulo}</h2>
                        <p style="margin-bottom: 1.5rem;">${proj.descricao}</p>
                    </div>
                    <a href="${proj.link}" target="_blank" class="btn" style="align-self: flex-start;">Ver projeto ↗</a>
                </article>
            `).join('');
        }

        carregarProjetos();
    </script>
