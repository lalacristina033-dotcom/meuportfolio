<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conheça os projetos e trabalhos desenvolvidos por mim ao longo da minha jornada na tecnologia.">
    <title>Meu Portfólio | Projetos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">MeuPortfólio</a>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="quemsoueu.html">Quem sou eu</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="login.html" class="lock-icon" aria-label="Entrar na área restrita">🔒</a></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 1100px; margin: 3rem auto; padding: 0 2rem;">
        <h1>Meus Projetos</h1>
        <p style="margin-top: 0.5rem; color: #666; font-size: 1.1rem; margin-bottom: 2rem;">
            Trabalhos carregados diretamente do meu banco de dados.
        </p>

        <div id="listaProjetos" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
            <p>Carregando projetos...</p>
        </div>
    </main>

    <footer style="text-align: center; padding: 2rem; color: #777; font-size: 0.9rem; border-top: 1px solid #eaeaea; margin-top: 4rem;">
        <p>&copy; 2026 - Desenvolvido com foco em SEO e semântica.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ffciozzntkkcedlgjnsv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmY2lvenpudGtrY2VkbGdqbnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTAyNjIsImV4cCI6MjExMDM4NjI2Mn0.gtJn41T6d5xUn-w3JV9FLaKh6UHOh07JyKvqmxr9PAU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarProjetos() {
            const container = document.getElementById('listaProjetos');
            const { data, error } = await supabaseClient.from('projetos').select('*');

            if (error) {
                container.innerHTML = '<p>Erro ao carregar projetos.</p>';
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p>Nenhum projeto cadastrado ainda.</p>';
                return;
            }

            container.innerHTML = data.map(proj => `
                <article style="background: #fff; border: 1px solid #eaeaea; border-radius: 8px; padding: 1.5rem;">
                    <h2 style="font-size: 1.3rem; margin-bottom: 0.5rem;">${proj.titulo}</h2>
                    <p style="color: #666; margin-bottom: 1rem; font-size: 0.95rem;">${proj.descricao}</p>
                    <a href="${proj.link}" target="_blank" class="btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Ver projeto</a>
                </article>
            `).join('');
        }

        carregarProjetos();
    </script>
</body>
</html>
