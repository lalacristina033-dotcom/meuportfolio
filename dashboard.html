<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Dashboard | Painel de Controle</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">MeuPortfólio (Painel)</a>
            <ul class="nav-links">
                <li><a href="portfolio.html">Ver Portfólio</a></li>
                <li><a href="index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 600px; margin: 3rem auto; padding: 2rem; background: #fff; border-radius: 8px; border: 1px solid #eaeaea;">
        <h1>Cadastrar Novo Projeto</h1>
        <p style="color: #666; margin-bottom: 1.5rem; font-size: 0.95rem;">Preencha os dados abaixo para salvar no banco de dados Supabase.</p>
        
        <form id="projetoForm">
            <div style="margin-bottom: 1rem;">
                <label for="titulo" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Título do Projeto</label>
                <input type="text" id="titulo" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label for="descricao" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Descrição</label>
                <textarea id="descricao" rows="4" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="link" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Link do Projeto</label>
                <input type="url" id="link" placeholder="https://..." required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; cursor: pointer; border: none;">Salvar no Supabase</button>
            <p id="statusMsg" style="margin-top: 1rem; text-align: center; font-weight: 500;"></p>
        </form>
    </main>

    <script>
        const SUPABASE_URL = 'https://ffciozzntkkcedlgjnsv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmY2lvenpudGtrY2VkbGdqbnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTAyNjIsImV4cCI6MjExMDM4NjI2Mn0.gtJn41T6d5xUn-w3JV9FLaKh6UHOh07JyKvqmxr9PAU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('projetoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = "Salvando...";
            statusMsg.style.color = "#555";

            const titulo = document.getElementById('titulo').value;
            const descricao = document.getElementById('descricao').value;
            const link = document.getElementById('link').value;

            const { error } = await supabaseClient
                .from('projetos')
                .insert([{ titulo: titulo, descricao: descricao, link: link }]);

            if (error) {
                statusMsg.textContent = "Erro ao salvar: " + error.message;
                statusMsg.style.color = "red";
            } else {
                statusMsg.textContent = "Projeto salvo com sucesso no Supabase!";
                statusMsg.style.color = "green";
                document.getElementById('projetoForm').reset();
            }
        });
    </script>
</body>
</html>
