    <main style="max-width: 650px;">
        <section class="card">
            <h1>Cadastrar Novo Projeto</h1>
            <p style="margin-bottom: 1.5rem;">Preencha os dados abaixo para salvar no banco de dados Supabase.</p>
            
            <form id="projetoForm">
                <div>
                    <label for="titulo">Título do Projeto</label>
                    <input type="text" id="titulo" placeholder="Ex: Sistema de Automação" required>
                </div>
                
                <div>
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="4" placeholder="Descreva o que foi desenvolvido..." required></textarea>
                </div>

                <div>
                    <label for="link">Link do Projeto</label>
                    <input type="url" id="link" placeholder="https://..." required>
                </div>
                
                <button type="submit" class="btn" style="width: 100%;">Salvar no Supabase</button>
                <p id="statusMsg" style="margin-top: 1rem; text-align: center; font-weight: 500;"></p>
            </form>
        </section>
    </main>

    <script src="js/matrix.js"></script>
    <script>
        const SUPABASE_URL = 'https://ffciozzntkkcedlgjnsv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmY2lvenpudGtrY2VkbGdqbnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTAyNjIsImV4cCI6MjExMDM4NjI2Mn0.gtJn41T6d5xUn-w3JV9FLaKh6UHOh07JyKvqmxr9PAU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('projetoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = "Salvando...";
            statusMsg.style.color = "#38bdf8";

            const titulo = document.getElementById('titulo').value;
            const descricao = document.getElementById('descricao').value;
            const link = document.getElementById('link').value;

            const { error } = await supabaseClient
                .from('projetos')
                .insert([{ titulo: titulo, descricao: descricao, link: link }]);

            if (error) {
                statusMsg.textContent = "Erro ao salvar: " + error.message;
                statusMsg.style.color = "#f87171";
            } else {
                statusMsg.textContent = "Projeto salvo com sucesso no Supabase!";
                statusMsg.style.color = "#34d399";
                document.getElementById('projetoForm').reset();
            }
        });
    </script>
