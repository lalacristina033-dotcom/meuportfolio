<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Login | Área Restrita</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">MeuPortfólio</a>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="quemsoueu.html">Quem sou eu</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="login.html" class="lock-icon" aria-label="Entrar na área restrita">🔒</a></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 400px; margin: 5rem auto; padding: 2rem; background: #fff; border-radius: 8px; border: 1px solid #eaeaea;">
        <h1 style="font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center;">Área Restrita</h1>
        
        <form id="loginForm">
            <div style="margin-bottom: 1rem;">
                <label for="usuario" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Usuário</label>
                <input type="text" id="usuario" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label for="senha" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Senha</label>
                <input type="password" id="senha" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; cursor: pointer; border: none;">Entrar</button>
            <p id="erroMsg" style="color: red; font-size: 0.9rem; margin-top: 1rem; text-align: center;"></p>
        </form>
    </main>

    <script>
        const SUPABASE_URL = 'https://ffciozzntkkcedlgjnsv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmY2lvenpudGtrY2VkbGdqbnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTAyNjIsImV4cCI6MjExMDM4NjI2Mn0.gtJn41T6d5xUn-w3JV9FLaKh6UHOh07JyKvqmxr9PAU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const usuarioInput = document.getElementById('usuario').value.trim();
            const senhaInput = document.getElementById('senha').value.trim();
            const erroMsg = document.getElementById('erroMsg');

            erroMsg.textContent = "Verificando...";
            erroMsg.style.color = "#555";

            const { data, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .eq('usuario', usuarioInput)
                .eq('senha', senhaInput);

            if (error || !data || data.length === 0) {
                erroMsg.textContent = "Usuário ou senha incorretos.";
                erroMsg.style.color = "red";
            } else {
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
