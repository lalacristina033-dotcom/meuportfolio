    <script>
        const SUPABASE_URL = 'https://ffciozzntkkcedlgjnsv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmY2lvenpudGtrY2VkbGdqbnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTAyNjIsImV4cCI6MjExMDM4NjI2Mn0.gtJn41T6d5xUn-w3JV9FLaKh6UHOh07JyKvqmxr9PAU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const usuarioInput = document.getElementById('usuario').value.trim();
            const senhaInput = document.getElementById('senha').value.trim();
            const erroMsg = document.getElementById('erroMsg');

            if (usuarioInput === 'admin' && senhaInput === '123456') {
                window.location.href = "dashboard.html";
                return;
            }

            erroMsg.textContent = "Verificando no banco...";
            erroMsg.style.color = "#38bdf8";

            try {
                const { data, error } = await supabaseClient
                    .from('usuarios')
                    .select('*')
                    .eq('usuario', usuarioInput)
                    .eq('senha', senhaInput);

                if (error || !data || data.length === 0) {
                    erroMsg.textContent = "Usuário ou senha incorretos.";
                    erroMsg.style.color = "#f87171";
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                erroMsg.textContent = "Erro de conexão com o Supabase.";
                erroMsg.style.color = "#f87171";
            }
        });
    </script>
